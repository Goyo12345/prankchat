<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>PrankChat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: #1a1a2e;
      color: white;
      font-family: 'Segoe UI', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 10px;
      color: #e94560;
    }

    p.subtitle {
      color: #aaa;
      margin-bottom: 40px;
    }

    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 30px;
      width: 500px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input {
      background: #0f3460;
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      color: white;
      font-size: 1rem;
      outline: none;
      width: 100%;
    }

    input::placeholder {
      color: #888;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-label {
      font-size: 1.3rem;
      width: 26px;
      text-align: center;
      flex-shrink: 0;
    }

    .opt-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .opt {
      background: #0f3460;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .opt:hover { background: #14477f; }
    .opt.active { background: #e94560; font-weight: bold; }

    .pos-grid {
      display: grid;
      grid-template-columns: repeat(3, 34px);
      grid-template-rows: repeat(3, 34px);
      gap: 4px;
    }

    .pos-grid .opt {
      padding: 0;
      font-size: 1.1rem;
    }

    button {
      background: #e94560;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button:hover {
      background: #c73652;
    }

    button:disabled {
      cursor: not-allowed;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      padding: 8px;
      border-radius: 8px;
    }

    .status.connecte {
      background: #1a4a2e;
      color: #4caf50;
    }

    .status.deconnecte {
      background: #4a1a1a;
      color: #f44336;
    }

    .status.attente {
      background: #3a3a1a;
      color: #ffeb3b;
    }

    .room-section {
      display: flex;
      gap: 10px;
    }

    .room-section input {
      flex: 1;
    }

    .room-section button {
      width: auto;
      padding: 12px 20px;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 4px;
    }

    .user-bar button {
      width: auto;
      padding: 6px 12px;
      font-size: 0.8rem;
      background: #0f3460;
    }

    .user-bar button:hover { background: #14477f; }

    .auth-secondary { background: #0f3460; }
    .auth-secondary:hover { background: #14477f; }

  </style>
  <link rel="stylesheet" href="i18n.css">
</head>
<body class="app">
  <h1>💥 PrankChat</h1>
  <p class="subtitle"><span data-i18n="tagline">Envoie des vannes à tes amis en temps réel</span></p>

  <!-- Écran de connexion (visible tant qu'on n'est pas connecté) -->
  <div class="card" id="authCard">
    <input type="email" id="authEmail" placeholder="Ton email" data-i18n-placeholder="email" />
    <input type="password" id="authPassword" placeholder="Ton mot de passe (min. 6 caractères)" data-i18n-placeholder="password" />
    <div class="status" id="authStatus" style="display:none"></div>
    <button onclick="logIn()"><span data-i18n="login">Se connecter</span></button>
    <button class="auth-secondary" onclick="signUp()"><span data-i18n="signup">Créer un compte</span></button>
  </div>

  <!-- L'app (cachée tant qu'on n'est pas connecté) -->
  <div class="card" id="appCard" style="display:none">
    <div class="user-bar">
      <span>👤 <span id="userEmail"></span></span>
      <span>
        <button id="premiumBtn" onclick="startSubscription()" style="display:none"><span data-i18n="premium">✨ Passer Premium</span></button>
        <button id="manageBtn" onclick="manageSubscription()" style="display:none"><span data-i18n="manage">Gérer l'abo</span></button>
        <button onclick="logOut()"><span data-i18n="logout">Déconnexion</span></button>
      </span>
    </div>

    <div class="room-section">
      <input type="text" id="roomCode" placeholder="Code de la room" data-i18n-placeholder="room" />
      <button onclick="generateRoomCode()" title="Générer un code sécurisé" data-i18n-title="generate">🎲</button>
      <button onclick="joinRoom()"><span data-i18n="join">Rejoindre</span></button>
    </div>

    <div class="status deconnecte" id="status"><span data-i18n="offline">❌ Non connecté</span></div>

    <!-- Freemium : compteur de pranks gratuits du jour (caché pour les abonnés) -->
    <div class="status" id="quotaBar" style="display:none"></div>

    <input type="text" id="imageUrl" placeholder="URL image, GIF, YouTube, TikTok..." data-i18n-placeholder="url" />
    <input type="text" id="caption" placeholder="Texte de la vanne (optionnel)" data-i18n-placeholder="caption" />

    <div class="controls">
      <div class="control-row">
        <span class="control-label" title="Durée d'affichage" data-i18n-title="duration">⏱️</span>
        <div class="opt-group" id="durationGroup">
          <button class="opt active" data-value="10000">10s</button>
          <button class="opt" data-value="20000">20s</button>
          <button class="opt" data-value="30000">30s</button>
          <button class="opt" data-value="40000">40s</button>
          <button class="opt" data-value="50000">50s</button>
          <button class="opt" data-value="60000">60s</button>
        </div>
      </div>

      <div class="control-row">
        <span class="control-label" title="Taille" data-i18n-title="size">🔎</span>
        <div class="opt-group" id="sizeGroup">
          <button class="opt" data-value="small"><span data-i18n="small">Petit</span></button>
          <button class="opt active" data-value="medium"><span data-i18n="medium">Moyen</span></button>
          <button class="opt" data-value="large"><span data-i18n="large">Grand</span></button>
        </div>
      </div>

      <div class="control-row">
        <span class="control-label" title="Position" data-i18n-title="position">📍</span>
        <div class="opt-group" id="positionGroup">
          <div class="pos-grid">
            <button class="opt" data-value="top-left" title="Haut-gauche" data-i18n-title="topLeft">↖</button>
            <button class="opt" data-value="top" title="Haut" data-i18n-title="top">↑</button>
            <button class="opt" data-value="top-right" title="Haut-droite" data-i18n-title="topRight">↗</button>
            <button class="opt" data-value="left" title="Gauche" data-i18n-title="left">←</button>
            <button class="opt active" data-value="center" title="Centre" data-i18n-title="center">●</button>
            <button class="opt" data-value="right" title="Droite" data-i18n-title="right">→</button>
            <button class="opt" data-value="bottom-left" title="Bas-gauche" data-i18n-title="bottomLeft">↙</button>
            <button class="opt" data-value="bottom" title="Bas" data-i18n-title="bottom">↓</button>
            <button class="opt" data-value="bottom-right" title="Bas-droite" data-i18n-title="bottomRight">↘</button>
          </div>
          <button class="opt" data-value="random" title="Position aléatoire" data-i18n-title="random">🎲</button>
        </div>
      </div>
    </div>

    <!-- Freemium : invitation à passer Premium quand les 5 pranks du jour sont épuisés -->
    <div id="upsellBox" style="display:none; text-align:center; background:#2a1a2e; border:1px solid #e94560; border-radius:12px; padding:14px; margin-bottom:10px;">
      <p style="margin:0 0 10px; line-height:1.4;"><span data-i18n="upsell">🔥 Tu as utilisé tes 5 pranks gratuits du jour ! Passe en Premium pour des pranks illimités.</span></p>
      <button onclick="startSubscription()"><span data-i18n="upgrade">✨ Passer en illimité — 2.99 CHF/mois</span></button>
      <button class="auth-secondary" onclick="recheckAccess()"><span data-i18n="recheck">🔄 J'ai payé, vérifier</span></button>
    </div>

    <button id="sendBtn" onclick="sendPrank()"><span data-i18n="send">🎯 Envoyer la vanne</span></button>
  </div>

  <!-- Écran "abonnement requis" (connecté mais pas abonné) -->
  <div class="card" id="subscribeCard" style="display:none">
    <div class="user-bar">
      <span>👤 <span id="userEmailSub"></span></span>
      <button onclick="logOut()"><span data-i18n="logout">Déconnexion</span></button>
    </div>
    <p style="text-align:center; line-height:1.5;">
      <span data-i18n="required">🔒 Pour envoyer des vannes, il te faut un abonnement actif.</span>
    </p>
    <button onclick="startSubscription()"><span data-i18n="subscribe">✨ S'abonner</span></button>
    <button class="auth-secondary" onclick="recheckAccess()"><span data-i18n="recheck">🔄 J'ai payé, vérifier</span></button>
  </div>

  <script src="translations.js"></script>
  <script src="i18n.js"></script>
  <script src="config.js"></script>
  <script>
    const { ipcRenderer } = require('electron')
    const io = require('socket.io-client')
    const syncLanguage = () => ipcRenderer.send('set-language', I18n.language)
    window.addEventListener('languagechange', syncLanguage)
    syncLanguage()
    const { createClient } = require('@supabase/supabase-js')

    const supabase = createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY)

    let socket = null
    let currentRoom = null
    let mySendToken = null

    // Freemium : abonné = illimité ; sinon 5 pranks gratuits par jour.
    const FREE_LIMIT = 5
    let mySubscribed = false
    let myRemaining = FREE_LIMIT // pranks gratuits restants (le serveur fait foi, il nous le dit)

    // Met à jour l'affichage Premium : bouton du haut, compteur, message d'invitation.
    function updatePremiumUI(subscribed, remaining) {
      mySubscribed = subscribed
      document.getElementById('premiumBtn').style.display = subscribed ? 'none' : ''
      document.getElementById('manageBtn').style.display = subscribed ? '' : 'none'

      const quotaBar = document.getElementById('quotaBar')
      const upsell = document.getElementById('upsellBox')

      if (subscribed) {
        quotaBar.style.display = 'none'
        upsell.style.display = 'none'
        return
      }

      if (typeof remaining === 'number') {
        myRemaining = remaining
        quotaBar.style.display = 'block'
        quotaBar.className = 'status ' + (remaining > 0 ? 'attente' : 'deconnecte')
        I18n.text(quotaBar, remaining > 0 ? 'quota' : 'exhausted', { remaining, limit: FREE_LIMIT })
        upsell.style.display = remaining > 0 ? 'none' : 'block'
      }
    }

    function isYoutubeOrTiktok(url) {
      return url.includes('youtube.com') ||
             url.includes('youtu.be') ||
             url.includes('tiktok.com')
    }

    // Génère un code de room aléatoire et impossible à deviner.
    // On évite les caractères ambigus (0/O, 1/l/i) pour qu'il reste lisible.
    function generateRoomCode() {
      const chars = 'abcdefghjkmnpqrstuvwxyz23456789'
      const bytes = new Uint8Array(8)
      window.crypto.getRandomValues(bytes)
      let code = ''
      for (let i = 0; i < 8; i++) {
        code += chars[bytes[i] % chars.length]
      }
      document.getElementById('roomCode').value = code
    }

    // Boutons d'options (durée, taille, position) : un seul actif par groupe.
    document.querySelectorAll('.opt-group').forEach((group) => {
      group.addEventListener('click', (e) => {
        const btn = e.target.closest('.opt')
        if (!btn) return
        group.querySelectorAll('.opt').forEach((b) => b.classList.remove('active'))
        btn.classList.add('active')
      })
    })

    function getOption(groupId) {
      const active = document.querySelector('#' + groupId + ' .opt.active')
      return active ? active.dataset.value : null
    }

    // ---------- Connexion / Inscription (Supabase) ----------

    function showAuthStatus(msg, ok) {
      const el = document.getElementById('authStatus')
      const key = Object.keys(PRANKCHAT_TRANSLATIONS).find(key => I18n.t(key) === msg)
      if (key) I18n.text(el, key)
      else el.textContent = msg
      el.className = 'status ' + (ok ? 'connecte' : 'deconnecte')
      el.style.display = 'block'
    }

    const SERVER = 'https://prankchat-production.up.railway.app'

    // Après connexion : on demande au serveur si l'abonnement est actif,
    // puis on affiche soit l'app, soit l'écran "abonne-toi".
    async function enterApp(session) {
      document.getElementById('authCard').style.display = 'none'
      document.getElementById('userEmail').textContent = session.user.email
      document.getElementById('userEmailSub').textContent = session.user.email

      let subscribed = false
      let remaining = FREE_LIMIT
      try {
        const res = await fetch(SERVER + '/access', {
          headers: { Authorization: 'Bearer ' + session.access_token }
        })
        const data = await res.json()
        subscribed = data.subscribed
        // Le serveur nous donne le VRAI reste du jour (0 à 5) : on l'affiche tel quel,
        // pour ne pas montrer "5/5" à tort après une reconnexion.
        if (typeof data.remaining === 'number') remaining = data.remaining
      } catch (e) {
        console.error('Vérif abonnement échouée:', e)
      }

      // Freemium : tout le monde entre dans l'app. L'abonnement débloque l'illimité ;
      // sinon on affiche le vrai compteur "X/5" dès la connexion.
      document.getElementById('subscribeCard').style.display = 'none'
      document.getElementById('appCard').style.display = 'flex'
      updatePremiumUI(subscribed, subscribed ? null : remaining)
    }

    function showLogin() {
      document.getElementById('appCard').style.display = 'none'
      document.getElementById('subscribeCard').style.display = 'none'
      document.getElementById('authCard').style.display = 'flex'
    }

    async function startSubscription() {
      const { data } = await supabase.auth.getSession()
      if (!data.session) return
      try {
        const res = await fetch(SERVER + '/create-checkout', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + data.session.access_token }
        })
        const { url } = await res.json()
        if (url) {
          require('electron').shell.openExternal(url) // ouvre la page de paiement dans le navigateur
        } else {
          alert(I18n.t('checkoutError'))
        }
      } catch (e) {
        alert(I18n.t('networkError'))
      }
    }

    // Après le paiement, l'utilisateur revient et clique "J'ai payé" -> on re-vérifie.
    async function recheckAccess() {
      const { data } = await supabase.auth.getSession()
      if (data.session) enterApp(data.session)
    }

    // Ouvre le portail Stripe pour gérer / annuler son abonnement.
    async function manageSubscription() {
      const { data } = await supabase.auth.getSession()
      if (!data.session) return
      try {
        const res = await fetch(SERVER + '/portal', {
          method: 'POST',
          headers: { Authorization: 'Bearer ' + data.session.access_token }
        })
        const { url } = await res.json()
        if (url) {
          require('electron').shell.openExternal(url)
        } else {
          alert(I18n.t('portalError'))
        }
      } catch (e) {
        alert(I18n.t('networkError'))
      }
    }

    async function signUp() {
      const email = document.getElementById('authEmail').value.trim()
      const password = document.getElementById('authPassword').value
      if (!email || !password) { showAuthStatus(I18n.t('credentials'), false); return }
      if (!document.getElementById('authEmail').checkValidity()) { showAuthStatus(I18n.t('invalidEmail'), false); return }
      if (password.length < 6) { showAuthStatus(I18n.t('weakPassword'), false); return }
      try {
        // Le serveur crée le compte (déjà confirmé), puis on se connecte direct.
        const res = await fetch(SERVER + '/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        })
        const data = await res.json()
        if (!res.ok || data.error) {
          const errorKeys = { email_exists: 'accountExists', user_already_exists: 'accountExists', email_address_invalid: 'invalidEmail', weak_password: 'weakPassword', over_request_rate_limit: 'tooMany' }
          showAuthStatus(I18n.t(res.status === 429 ? 'tooMany' : errorKeys[data.code] || 'signupError'), false)
          return
        }
        const { data: loginData, error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) { showAuthStatus(I18n.t('loginError'), false); return }
        enterApp(loginData.session)
      } catch (e) {
        showAuthStatus(I18n.t('networkError'), false)
      }
    }

    async function logIn() {
      const email = document.getElementById('authEmail').value.trim()
      const password = document.getElementById('authPassword').value
      if (!email || !password) { showAuthStatus(I18n.t('credentials'), false); return }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password })
      if (error) { showAuthStatus(I18n.t('loginError'), false); return }
      enterApp(data.session)
    }

    async function logOut() {
      await supabase.auth.signOut()
      if (socket) { socket.disconnect(); socket = null; currentRoom = null }
      showLogin()
    }

    // Au démarrage : si une session est déjà enregistrée, on ouvre l'app direct.
    supabase.auth.getSession().then(({ data }) => {
      if (data.session) enterApp(data.session)
    })

    async function joinRoom() {
      const roomCode = document.getElementById('roomCode').value.trim()
      if (!roomCode) {
        alert(I18n.t('enterRoom'))
        return
      }

      // On récupère notre jeton de connexion (il prouve l'abonnement au serveur).
      const { data: sess } = await supabase.auth.getSession()
      const accessToken = sess.session ? sess.session.access_token : null

      socket = io('https://prankchat-production.up.railway.app')

      socket.on('connect', () => {
        // On rejoint la room, on présente notre jeton, et on récupère le jeton d'envoi.
        socket.emit('join-room', roomCode, accessToken, (token) => {
          mySendToken = token
        })
        currentRoom = roomCode
        I18n.text('status', 'waiting')
        document.getElementById('status').className = 'status attente'
      })

      socket.on('friend-connected', () => {
        I18n.text('status', 'connected')
        document.getElementById('status').className = 'status connecte'
      })

      socket.on('room-users', (count) => {
        if (count >= 2) {
          I18n.text('status', 'connected')
          document.getElementById('status').className = 'status connecte'
        }
      })

      socket.on('receive-prank', (data) => {
        ipcRenderer.send('show-prank', data)
      })

      // Freemium : le serveur nous dit combien de pranks gratuits il nous reste.
      socket.on('quota', (q) => {
        updatePremiumUI(q.subscribed, q.remaining)
      })
      // Le serveur a refusé l'envoi : quota du jour épuisé -> on propose Premium.
      socket.on('limit-reached', () => {
        updatePremiumUI(false, 0)
      })
    }

    function sendPrank() {
      if (!socket || !currentRoom) {
        alert(I18n.t('joinFirst'))
        return
      }

      const imageUrl = document.getElementById('imageUrl').value
      const caption = document.getElementById('caption').value
      const duration = parseInt(getOption('durationGroup'), 10)
      const position = getOption('positionGroup')
      const size = getOption('sizeGroup')

      if (!imageUrl) {
        alert(I18n.t('enterUrl'))
        return
      }

      // Freemium : si le quota gratuit du jour est épuisé, on n'envoie rien et on
      // affiche l'invitation à passer Premium (le serveur bloque aussi, par sécurité).
      if (!mySubscribed && myRemaining <= 0) {
        updatePremiumUI(false, 0)
        return
      }

      const btn = document.getElementById('sendBtn')
      btn.disabled = true
      I18n.text(btn, 'sending')
      btn.style.background = '#888'

      if (isYoutubeOrTiktok(imageUrl)) {
        // YouTube/TikTok : on télécharge sur CE PC puis on relaie au serveur.
        // (Le serveur relaiera le lien .mp4 à OBS et à l'ami.)
        ipcRenderer.send('download-and-relay', {
          imageUrl,
          caption,
          roomCode: currentRoom,
          senderId: socket.id,
          sendToken: mySendToken,
          duration,
          position,
          size
        })
      } else {
        // Image / GIF / vidéo .mp4 directe : le serveur relaie l'URL telle quelle.
        socket.emit('send-prank', {
          roomCode: currentRoom,
          imageUrl,
          caption,
          duration,
          position,
          size
        })

        ipcRenderer.send('show-prank', { imageUrl, caption, duration, position, size })
      }

      setTimeout(() => {
        btn.disabled = false
        I18n.text(btn, 'send')
        btn.style.background = '#e94560'
      }, 8000)
    }

    // Freemium : l'envoi d'une vidéo YouTube/TikTok a été refusé par le serveur
    // (quota du jour épuisé) -> on propose Premium.
    ipcRenderer.on('prank-limit-reached', () => {
      updatePremiumUI(false, 0)
    })

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        ipcRenderer.send('close-overlay')
      }
    })
  </script>
</body>
</html>
